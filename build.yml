name: Build Home Studio APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          if [ ! -d home_studio ] && [ -f project.zip ]; then unzip -q project.zip; fi
          test -f home_studio/pubspec.yaml || { echo "Upload project.zip to the top of the repository first."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add the standard Android project files
        working-directory: home_studio
        run: flutter create --project-name home_studio --org com.homestudio --platforms android .

      - name: Build APK
        working-directory: home_studio
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../HomeStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HomeStudio-apk
          path: HomeStudio.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Home Studio (build ${{ github.run_number }})
          body: Download HomeStudio.apk below and install it on your TV.
          files: HomeStudio.apk
